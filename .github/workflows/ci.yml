name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate code
        run: just generate

      - name: Check (lint + typecheck)
        run: just check

      - name: Format check
        run: just fmt-check

      - name: Test
        run: just test

      - name: Secret scan
        run: just secret-scan
